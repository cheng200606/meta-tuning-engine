# M0 静态 preset 验证 A：简洁 persona（并行=1 为默认，无需覆盖）
# 官方 preset 不含 agent-loop（循环留在根组合）；persona 经 dsh-persona 注入
- insert:
    - id: preset-meta-a
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: meta-a
        name: Meta A (concise, serial)
        order: 90
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are an efficient assistant. Answer directly with minimal explanation.
              complete: true
              includeRuntimeContext: false