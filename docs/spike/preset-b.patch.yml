# M0 静态 preset 验证 B：分步 persona + 根部 agent-loop 并行覆盖
# 注意：maxParallelToolCalls 不能放进 preset（会与根部 agentLoop 服务冲突），
# 官方模式是循环留在根组合；此处用配置覆盖行修改根部 agent-loop。
- id: agent-loop
  config:
    maxParallelToolCalls: 3
- insert:
    - id: preset-meta-b
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: meta-b
        name: Meta B (step-by-step, parallel)
        order: 91
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a step-by-step reasoning assistant. Decompose the task into steps, then execute them one by one.
              complete: true
              includeRuntimeContext: false